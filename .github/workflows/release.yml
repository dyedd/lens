name: Release

# 提交攒够后自动发版：升 patch 版本号 → 构建并推送多架构镜像 → 发布正式 release。
on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）检查一次 main 上的应用提交数。
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只预演，不升版本、不建镜像、不发 release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      released: ${{ steps.gate.outputs.released }}
      dry_run: ${{ inputs.dry_run }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      major_minor: ${{ steps.bump.outputs.major_minor }}
      sha: ${{ steps.bump.outputs.sha }}
      short_sha: ${{ steps.bump.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check commit threshold
        id: gate
        shell: bash
        env:
          # 自动发版累计 5 个应用提交；手动触发至少 1 个，纯文档提交不计入。
          MIN_COMMITS: ${{ github.event_name == 'schedule' && '5' || '1' }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          last_tag="$(git for-each-ref --sort=-version:refname --count=1 --format='%(refname:short)' 'refs/tags/v[0-9]*')"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..origin/main"
          else
            range="origin/main"
          fi

          count="$(git rev-list --count "$range" -- . \
            ':(exclude)docs/**' ':(exclude)*.md' ':(exclude)screenshots/**' \
            ':(exclude).github/workflows/docs.yml')"
          echo "自 ${last_tag:-仓库起点} 以来共 ${count} 个应用提交，发版门槛 ${MIN_COMMITS} 个"

          if [ "$count" -eq 0 ]; then
            echo "没有新的应用提交，跳过发版"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$count" -lt "$MIN_COMMITS" ]; then
            echo "提交数未达门槛 ${MIN_COMMITS} 个，跳过发版"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 预览只打印将要发生的动作，不改仓库、不打 tag、不建镜像。
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Preview release
        if: steps.gate.outputs.released == 'true' && inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail

          # 与实际发版保持同一份代码，避免 checkout 快照落后于 main。
          git fetch origin main --tags --force
          git reset --hard origin/main

          last_tag="$(git for-each-ref --sort=-version:refname --count=1 --format='%(refname:short)' 'refs/tags/v[0-9]*')"
          if [ -n "$last_tag" ]; then
            base_version="${last_tag#v}"
          else
            base_version="0.0.0"
          fi

          version="$(python3 scripts/bump_version.py --base-version "$base_version" --dry-run)"
          echo "预览：将于 v${version} 发版，并同步源码与文档版本文件"
          echo "预览：镜像标签 latest、dev、v${version}、${version}、${version%.*}"

          echo "预览模式，未改版本号、未建镜像、未发 release"

      - name: Bump version
        id: bump
        if: steps.gate.outputs.released == 'true' && !inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          git reset --hard origin/main

          last_tag="$(git for-each-ref --sort=-version:refname --count=1 --format='%(refname:short)' 'refs/tags/v[0-9]*')"
          if [ -n "$last_tag" ]; then
            base_version="${last_tag#v}"
          else
            base_version="0.0.0"
          fi

          version="$(python3 scripts/bump_version.py --base-version "$base_version")"

          if ! git diff --quiet -- backend/app/__init__.py docs/public/version.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/app/__init__.py docs/public/version.txt
            git commit -m "chore: 更新版本号至 ${version}"
            git push origin HEAD:refs/heads/main
          fi

          git fetch origin main --tags --force
          sha="$(git rev-parse origin/main)"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

  containers:
    name: Build release image
    needs: prepare
    if: needs.prepare.outputs.released == 'true' && needs.prepare.outputs.dry_run != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      push: true
      tags: |
        type=raw,value=dev
        type=raw,value=latest
        type=raw,value=${{ needs.prepare.outputs.tag }}
        type=raw,value=${{ needs.prepare.outputs.version }}
        type=raw,value=${{ needs.prepare.outputs.major_minor }}
        type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

  publish:
    name: Publish release
    needs: [prepare, containers]
    if: needs.prepare.outputs.released == 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Compose release notes
        id: notes
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          commit_type() {
            local subject="$1"

            case "$subject" in
              feat:*|feat\(*:*) echo "feat" ;;
              fix:*|fix\(*:*) echo "fix" ;;
              perf:*|perf\(*:*) echo "perf" ;;
              refactor:*|refactor\(*:*) echo "refactor" ;;
              docs:*|docs\(*:*) echo "docs" ;;
              chore:*|chore\(*:*) echo "chore" ;;
              style:*|style\(*:*) echo "style" ;;
              test:*|test\(*:*) echo "test" ;;
              ci:*|ci\(*:*) echo "ci" ;;
              build:*|build\(*:*) echo "build" ;;
              *) echo "other" ;;
            esac
          }

          last_tag="$(git for-each-ref --sort=-version:refname --count=1 --format='%(refname:short)' 'refs/tags/v[0-9]*')"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..${SHA}"
          else
            range="${SHA}"
          fi

          commit_count="$(git rev-list --count "$range")"
          if [ "$commit_count" -eq 0 ]; then
            echo "No commits found for release" >&2
            exit 1
          fi

          body_path="release-body.md"
          features_file="$(mktemp)"
          fixes_file="$(mktemp)"
          refactors_file="$(mktemp)"
          docs_file="$(mktemp)"
          maintenance_file="$(mktemp)"
          others_file="$(mktemp)"

          while IFS=$'\t' read -r sha subject; do
            short_sha="${sha:0:7}"
            line="- ${subject} (${short_sha})"
            type="$(commit_type "$subject")"

            if [ "$type" = "feat" ]; then
              echo "$line" >> "$features_file"
            elif [ "$type" = "fix" ] || [ "$type" = "perf" ]; then
              echo "$line" >> "$fixes_file"
            elif [ "$type" = "refactor" ]; then
              echo "$line" >> "$refactors_file"
            elif [ "$type" = "docs" ]; then
              echo "$line" >> "$docs_file"
            elif [ "$type" = "chore" ] || [ "$type" = "style" ] || [ "$type" = "test" ] || [ "$type" = "ci" ] || [ "$type" = "build" ]; then
              echo "$line" >> "$maintenance_file"
            else
              echo "$line" >> "$others_file"
            fi
          done < <(git log --reverse --format='%H%x09%s' "$range")

          {
            echo "## Changes"
            echo

            if [ -s "$features_file" ]; then
              echo "### Features"
              cat "$features_file"
              echo
            fi

            if [ -s "$fixes_file" ]; then
              echo "### Fixes"
              cat "$fixes_file"
              echo
            fi

            if [ -s "$refactors_file" ]; then
              echo "### Refactors"
              cat "$refactors_file"
              echo
            fi

            if [ -s "$docs_file" ]; then
              echo "### Documentation"
              cat "$docs_file"
              echo
            fi

            if [ -s "$maintenance_file" ]; then
              echo "### Maintenance"
              cat "$maintenance_file"
              echo
            fi

            if [ -s "$others_file" ]; then
              echo "### Others"
              cat "$others_file"
              echo
            fi

            if [ -n "$last_tag" ]; then
              echo "## Range"
              echo
              echo "- From \`${last_tag}\` to \`${SHA:0:7}\`"
            else
              echo "## Range"
              echo
              echo "- Initial release from repository start to \`${SHA:0:7}\`"
            fi
          } > "$body_path"

          echo "body_path=${body_path}" >> "$GITHUB_OUTPUT"

      - name: Create published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BODY_PATH: ${{ steps.notes.outputs.body_path }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} 已存在，跳过创建"
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$BODY_PATH" \
            --target "$SHA" \
            --latest

  documentation:
    name: Publish documentation and version feed
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
