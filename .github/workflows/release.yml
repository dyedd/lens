name: Release

# 提交攒够后自动发版：升 patch 版本号 → 构建并推送多架构镜像 → 发布正式 release。
on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）检查一次 main 上的提交数
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只预演，不升版本、不建镜像、不发 release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      released: ${{ steps.gate.outputs.released }}
      dry_run: ${{ inputs.dry_run }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      major_minor: ${{ steps.bump.outputs.major_minor }}
      sha: ${{ steps.bump.outputs.sha }}
      short_sha: ${{ steps.bump.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check commit threshold
        id: gate
        shell: bash
        env:
          # 自动发版要攒够 5 个提交；手动触发只要 1 个（至少得有点实际改动）。
          MIN_COMMITS: ${{ github.event_name == 'schedule' && '5' || '1' }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..origin/main"
          else
            range="origin/main"
          fi

          count="$(git rev-list --count "$range")"
          echo "自 ${last_tag:-仓库起点} 以来共 ${count} 个提交，发版门槛 ${MIN_COMMITS} 个"

          if [ "$count" -eq 0 ]; then
            echo "没有新提交，跳过发版"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$count" -lt "$MIN_COMMITS" ]; then
            echo "提交数未达门槛 ${MIN_COMMITS} 个，跳过发版"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 预览只打印将要发生的动作，不改仓库、不打 tag、不建镜像。
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Preview release
        if: steps.gate.outputs.released == 'true' && inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail

          # 与实际发版保持同一份代码，避免 checkout 快照落后于 main。
          git fetch origin main --tags --force
          git reset --hard origin/main

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            base_version="${last_tag#v}"
          else
            base_version="0.0.0"
          fi

          # 与 Bump version 使用同一套推导，但不写文件、不提交。
          python3 - "$base_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          base_version = sys.argv[1]
          source = Path("backend/app/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if match is None:
              raise SystemExit("Could not find __version__")

          current_version = match.group(1)
          semver = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          base_match = semver.fullmatch(base_version)
          current_match = semver.fullmatch(current_version)
          if base_match is None or current_match is None:
              raise SystemExit(
                  f"Unsupported version: base={base_version}, current={current_version}"
              )

          base_parts = tuple(map(int, base_match.groups()))
          current_parts = tuple(map(int, current_match.groups()))
          if current_parts < base_parts:
              print(
                  f"预览：跳过发版，当前 {current_version} 落后于 {base_version}，"
                  "先把 backend/app/__init__.py 的版本号提到最新 tag"
              )
              raise SystemExit(0)

          if current_parts > base_parts:
              next_version = current_version
          else:
              major, minor, patch = base_parts
              next_version = f"{major}.{minor}.{patch + 1}"

          print(f"预览：将于 v{next_version} 发版")
          print(f"预览：镜像标签 latest、dev、v{next_version}、{next_version}、{'.'.join(next_version.split('.')[:2])}")
          print(f"预览：标题与 tag 为 v{next_version}")
          PY

          echo "预览模式，未改版本号、未建镜像、未发 release"

      - name: Bump version
        id: bump
        if: steps.gate.outputs.released == 'true' && !inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          git reset --hard origin/main

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            base_version="${last_tag#v}"
          else
            base_version="0.0.0"
          fi

          version="$(python3 - "$base_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          base_version = sys.argv[1]
          version_path = Path("backend/app/__init__.py")
          source = version_path.read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if match is None:
              raise SystemExit("Could not find __version__")

          current_version = match.group(1)
          semver = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          base_match = semver.fullmatch(base_version)
          current_match = semver.fullmatch(current_version)
          if base_match is None or current_match is None:
              raise SystemExit(
                  f"Unsupported version: base={base_version}, current={current_version}"
              )

          base_parts = tuple(map(int, base_match.groups()))
          current_parts = tuple(map(int, current_match.groups()))
          if current_parts < base_parts:
              raise SystemExit(
                  f"Current version {current_version} is behind latest tag {base_version}"
              )

          if current_parts > base_parts:
              next_version = current_version
          else:
              major, minor, patch = base_parts
              patch += 1
              next_version = f"{major}.{minor}.{patch}"

              updated = source[: match.start(1)] + next_version + source[match.end(1) :]
              version_path.write_text(updated, encoding="utf-8")

          print(next_version)
          PY
          )"

          if ! git diff --quiet -- backend/app/__init__.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/app/__init__.py
            git commit -m "chore: 更新版本号至 ${version}"
            git push origin HEAD:refs/heads/main
          fi

          git fetch origin main --tags --force
          sha="$(git rev-parse origin/main)"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

  containers:
    name: Build release image
    needs: prepare
    if: needs.prepare.outputs.released == 'true' && needs.prepare.outputs.dry_run != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-image.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      push: true
      tags: |
        type=raw,value=dev
        type=raw,value=latest
        type=raw,value=${{ needs.prepare.outputs.tag }}
        type=raw,value=${{ needs.prepare.outputs.version }}
        type=raw,value=${{ needs.prepare.outputs.major_minor }}
        type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}

  publish:
    name: Publish release
    needs: [prepare, containers]
    if: needs.prepare.outputs.released == 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Compose release notes
        id: notes
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          commit_type() {
            local subject="$1"

            case "$subject" in
              feat:*|feat\(*:*) echo "feat" ;;
              fix:*|fix\(*:*) echo "fix" ;;
              perf:*|perf\(*:*) echo "perf" ;;
              refactor:*|refactor\(*:*) echo "refactor" ;;
              docs:*|docs\(*:*) echo "docs" ;;
              chore:*|chore\(*:*) echo "chore" ;;
              style:*|style\(*:*) echo "style" ;;
              test:*|test\(*:*) echo "test" ;;
              ci:*|ci\(*:*) echo "ci" ;;
              build:*|build\(*:*) echo "build" ;;
              *) echo "other" ;;
            esac
          }

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..${SHA}"
          else
            range="${SHA}"
          fi

          commit_count="$(git rev-list --count "$range")"
          if [ "$commit_count" -eq 0 ]; then
            echo "No commits found for release" >&2
            exit 1
          fi

          body_path="release-body.md"
          features_file="$(mktemp)"
          fixes_file="$(mktemp)"
          refactors_file="$(mktemp)"
          docs_file="$(mktemp)"
          maintenance_file="$(mktemp)"
          others_file="$(mktemp)"

          while IFS=$'\t' read -r sha subject; do
            short_sha="${sha:0:7}"
            line="- ${subject} (${short_sha})"
            type="$(commit_type "$subject")"

            if [ "$type" = "feat" ]; then
              echo "$line" >> "$features_file"
            elif [ "$type" = "fix" ] || [ "$type" = "perf" ]; then
              echo "$line" >> "$fixes_file"
            elif [ "$type" = "refactor" ]; then
              echo "$line" >> "$refactors_file"
            elif [ "$type" = "docs" ]; then
              echo "$line" >> "$docs_file"
            elif [ "$type" = "chore" ] || [ "$type" = "style" ] || [ "$type" = "test" ] || [ "$type" = "ci" ] || [ "$type" = "build" ]; then
              echo "$line" >> "$maintenance_file"
            else
              echo "$line" >> "$others_file"
            fi
          done < <(git log --reverse --format='%H%x09%s' "$range")

          {
            echo "## Changes"
            echo

            if [ -s "$features_file" ]; then
              echo "### Features"
              cat "$features_file"
              echo
            fi

            if [ -s "$fixes_file" ]; then
              echo "### Fixes"
              cat "$fixes_file"
              echo
            fi

            if [ -s "$refactors_file" ]; then
              echo "### Refactors"
              cat "$refactors_file"
              echo
            fi

            if [ -s "$docs_file" ]; then
              echo "### Documentation"
              cat "$docs_file"
              echo
            fi

            if [ -s "$maintenance_file" ]; then
              echo "### Maintenance"
              cat "$maintenance_file"
              echo
            fi

            if [ -s "$others_file" ]; then
              echo "### Others"
              cat "$others_file"
              echo
            fi

            if [ -n "$last_tag" ]; then
              echo "## Range"
              echo
              echo "- From \`${last_tag}\` to \`${SHA:0:7}\`"
            else
              echo "## Range"
              echo
              echo "- Initial release from repository start to \`${SHA:0:7}\`"
            fi
          } > "$body_path"

          echo "body_path=${body_path}" >> "$GITHUB_OUTPUT"

      - name: Create published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BODY_PATH: ${{ steps.notes.outputs.body_path }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} 已存在，跳过创建"
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$BODY_PATH" \
            --target "$SHA" \
            --latest
