name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check application changes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            BASE="$(git merge-base "$BASE" "$HEAD")"
          fi
          if [ "$EVENT" = release ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" "$HEAD" -- . \
            ':(exclude)docs/**' ':(exclude)*.md' ':(exclude)screenshots/**' \
            ':(exclude).github/workflows/docs.yml'; then
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests scripts

      - name: Lint backend
        run: |
          uv run --no-sync ruff check backend
          uv run --no-sync ruff format --check backend

      - name: Test backend
        run: uv run --no-sync python -m pytest backend/tests -q --confcutdir=backend/tests -n auto --dist worksteal

      - name: Validate backend migrations
        env:
          LENS_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/lens-ci.db
        run: |
          uv run --no-sync python -m app.cli db upgrade
          cd backend && uv run --no-sync python -m alembic check && cd ..
          uv run --no-sync python -m app.cli db current

  frontend:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm exec biome ci .

      - name: Type check frontend
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build

  containers:
    name: Build app image
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-image.yml
    secrets: inherit
    with:
      push: ${{ github.event_name != 'pull_request' }}
      prune: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      tags: |
        type=raw,value=dev,enable=${{ github.event_name == 'push' || github.event_name == 'release' }}
        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
        type=ref,event=tag,enable=${{ github.event_name == 'release' }}
        type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
        type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
        type=sha,prefix=sha-
