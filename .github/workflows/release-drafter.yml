name: Draft Release

on:
  workflow_dispatch:

jobs:
  draft_release:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Prepare version on dev
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main dev --tags
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            base_version="${last_tag#v}"
          else
            base_version="0.0.0"
          fi

          next_version="$(python - "$base_version" <<'PY'
          import re
          import sys
          from pathlib import Path

          base_version = sys.argv[1]
          version_path = Path("lens_api/__init__.py")
          source = version_path.read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', source)
          if match is None:
              raise SystemExit("Could not find __version__")

          current_version = match.group(1)
          semver = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          base_match = semver.fullmatch(base_version)
          current_match = semver.fullmatch(current_version)
          if base_match is None or current_match is None:
              raise SystemExit(
                  f"Unsupported version: base={base_version}, current={current_version}"
              )

          base_parts = tuple(map(int, base_match.groups()))
          current_parts = tuple(map(int, current_match.groups()))
          if current_parts < base_parts:
              raise SystemExit(
                  f"Current version {current_version} is behind latest tag {base_version}"
              )

          if current_parts > base_parts:
              next_version = current_version
          else:
              major, minor, patch = base_parts
              patch += 1
              next_version = f"{major}.{minor}.{patch}"

              updated = source[: match.start(1)] + next_version + source[match.end(1) :]
              version_path.write_text(updated, encoding="utf-8")

          print(next_version)
          PY
          )"

          if ! git diff --quiet -- lens_api/__init__.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lens_api/__init__.py
            git commit -m "chore: 更新版本号至 ${next_version}"
            git push origin HEAD:refs/heads/dev
          fi

          echo "version=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Sync dev into main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main dev --tags
          git checkout -B main origin/main
          git merge --ff-only origin/dev
          git push origin HEAD:refs/heads/main

      - name: Prepare draft release
        id: prepare
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          commit_type() {
            local subject="$1"

            case "$subject" in
              feat:*|feat\(*:*) echo "feat" ;;
              fix:*|fix\(*:*) echo "fix" ;;
              perf:*|perf\(*:*) echo "perf" ;;
              refactor:*|refactor\(*:*) echo "refactor" ;;
              docs:*|docs\(*:*) echo "docs" ;;
              chore:*|chore\(*:*) echo "chore" ;;
              style:*|style\(*:*) echo "style" ;;
              test:*|test\(*:*) echo "test" ;;
              ci:*|ci\(*:*) echo "ci" ;;
              build:*|build\(*:*) echo "build" ;;
              *) echo "other" ;;
            esac
          }

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi
          current_sha="$(git rev-parse HEAD)"

          commit_count="$(git rev-list --count "$range")"
          if [ "$commit_count" -eq 0 ]; then
            echo "No commits found for draft release" >&2
            exit 1
          fi

          next_tag="v${NEXT_VERSION}"
          body_path="release-body.md"
          features_file="$(mktemp)"
          fixes_file="$(mktemp)"
          refactors_file="$(mktemp)"
          docs_file="$(mktemp)"
          maintenance_file="$(mktemp)"
          others_file="$(mktemp)"

          while IFS=$'\t' read -r sha subject; do
            short_sha="${sha:0:7}"
            line="- ${subject} (${short_sha})"
            type="$(commit_type "$subject")"

            if [ "$type" = "feat" ]; then
              echo "$line" >> "$features_file"
            elif [ "$type" = "fix" ] || [ "$type" = "perf" ]; then
              echo "$line" >> "$fixes_file"
            elif [ "$type" = "refactor" ]; then
              echo "$line" >> "$refactors_file"
            elif [ "$type" = "docs" ]; then
              echo "$line" >> "$docs_file"
            elif [ "$type" = "chore" ] || [ "$type" = "style" ] || [ "$type" = "test" ] || [ "$type" = "ci" ] || [ "$type" = "build" ]; then
              echo "$line" >> "$maintenance_file"
            else
              echo "$line" >> "$others_file"
            fi
          done < <(git log --reverse --format='%H%x09%s' "$range")

          {
            echo "## Changes"
            echo

            if [ -s "$features_file" ]; then
              echo "### Features"
              cat "$features_file"
              echo
            fi

            if [ -s "$fixes_file" ]; then
              echo "### Fixes"
              cat "$fixes_file"
              echo
            fi

            if [ -s "$refactors_file" ]; then
              echo "### Refactors"
              cat "$refactors_file"
              echo
            fi

            if [ -s "$docs_file" ]; then
              echo "### Documentation"
              cat "$docs_file"
              echo
            fi

            if [ -s "$maintenance_file" ]; then
              echo "### Maintenance"
              cat "$maintenance_file"
              echo
            fi

            if [ -s "$others_file" ]; then
              echo "### Others"
              cat "$others_file"
              echo
            fi

            if [ -n "$last_tag" ]; then
              echo "## Range"
              echo
              echo "- From \`${last_tag}\` to \`${current_sha:0:7}\`"
            else
              echo "## Range"
              echo
              echo "- Initial draft release from repository start to \`${current_sha:0:7}\`"
            fi
          } > "$body_path"

          echo "tag_name=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "body_path=${body_path}" >> "$GITHUB_OUTPUT"
          echo "target_commitish=${current_sha}" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.prepare.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.prepare.outputs.release_name }}
          BODY_PATH: ${{ steps.prepare.outputs.body_path }}
          TARGET_COMMITISH: ${{ steps.prepare.outputs.target_commitish }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file "$BODY_PATH" \
              --target "$TARGET_COMMITISH" \
              --draft
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file "$BODY_PATH" \
              --target "$TARGET_COMMITISH" \
              --draft
          fi
