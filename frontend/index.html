<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lens</title>
    <meta name="description" content="渠道、模型组与系统配置管理后台" />
    <link rel="canonical" />
    <link rel="icon" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "name": "Lens",
            "speakable": {
              "@type": "SpeakableSpecification",
              "cssSelector": ["h1"]
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Lens",
            "description": "Self-hosted multi-provider LLM gateway and administration console.",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web"
          }
        ]
      }
    </script>
    <!--
      Applies the stored theme before first paint. Must stay a classic inline
      script: a module script is deferred and would flash the default theme.
      The storage key matches THEME_STORAGE_KEY in src/lib/theme.ts.
    -->
    <script>
      (() => {
        const canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) {
          canonical.href = window.location.origin + window.location.pathname;
        }

        try {
          const stored = localStorage.getItem("lens_theme");
          const dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch {
          // localStorage may throw on quota/private mode; default theme still applies
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main>
        <h1>Lens</h1>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
