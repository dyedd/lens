<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/logo.svg" fetchpriority="high" />
    <meta name="color-scheme" content="light dark" />
    <title>Lens</title>
    <meta name="description" content="渠道、模型组与系统配置管理后台" />
    <link rel="canonical" />
    <link rel="icon" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "name": "Lens",
            "speakable": {
              "@type": "SpeakableSpecification",
              "cssSelector": ["h1"]
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Lens",
            "description": "Self-hosted multi-provider LLM gateway and administration console.",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web"
          }
        ]
      }
    </script>
    <!--
      Applies the stored theme before first paint. Must stay a classic inline
      script: a module script is deferred and would flash the default theme.
      The storage key matches THEME_STORAGE_KEY in src/lib/theme.ts.
    -->
    <script>
      (() => {
        const canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) {
          canonical.href = window.location.origin + window.location.pathname;
        }

        const root = document.documentElement;
        let stored;
        try {
          stored = localStorage.getItem("lens_theme");
          const locale = localStorage.getItem("lens_locale");
          if (locale === "zh-CN" || locale === "en-US") root.lang = locale;
        } catch {
          // Site data restrictions can block localStorage reads.
        }
        const colorScheme =
          stored === "light" || stored === "dark" ? stored : "light dark";
        root.classList.toggle(
          "dark",
          colorScheme === "dark" ||
            (colorScheme === "light dark" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches),
        );
        root.style.colorScheme = colorScheme;
        document.querySelector('meta[name="color-scheme"]').content = colorScheme;
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main>
        <h1>Lens</h1>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
