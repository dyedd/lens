# Local formatting hooks for Lens. Install with: uv run --no-sync prek install -f
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: unsupported
        types: [python]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude --fix
        language: unsupported
        types: [python]
        require_serial: true

      - id: biome-format
        name: biome format
        entry: pnpm --dir frontend run format
        language: unsupported
        files: ^frontend/
        pass_filenames: false
